<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>足球竞猜知识库管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">K</div>
          <div>
            <div class="logo-text">知识库管理</div>
            <div class="logo-sub">Football Odds KB</div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">核心功能</div>
          <button class="nav-item active" data-page="dashboard">
            <span class="nav-icon">📊</span>
            <span>仪表盘</span>
          </button>
          <button class="nav-item" data-page="rules">
            <span class="nav-icon">📋</span>
            <span>规则库管理</span>
            <span class="nav-badge">12</span>
          </button>
          <button class="nav-item" data-page="matches">
            <span class="nav-icon">⚽</span>
            <span>比赛分析</span>
            <span class="nav-badge">5</span>
          </button>
          <button class="nav-item" data-page="sensitivity">
            <span class="nav-icon">🔍</span>
            <span>数据敏感度</span>
            <span class="nav-badge yellow">2</span>
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">系统</div>
          <button class="nav-item" onclick="App.showToast('功能开发中', 'info')">
            <span class="nav-icon">⚙</span>
            <span>设置</span>
          </button>
          <button class="nav-item" onclick="App.showToast('帮助文档开发中', 'info')">
            <span class="nav-icon">❓</span>
            <span>帮助</span>
          </button>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <span class="topbar-title">仪表盘</span>
        <div class="topbar-actions">
          <span style="font-size:12px;color:var(--text-muted);">数据更新时间: 2026-08-13 16:00</span>
        </div>
      </header>

      <div class="page-content">
        <!-- Dashboard Page -->
        <div class="page active" id="page-dashboard">
          <div id="dashboard-content"></div>
        </div>

        <!-- Rules Page -->
        <div class="page" id="page-rules">
          <div id="rules-content"></div>
        </div>

        <!-- Matches Page -->
        <div class="page" id="page-matches">
          <div id="matches-content"></div>
        </div>

        <!-- Sensitivity Page -->
        <div class="page" id="page-sensitivity">
          <div id="sensitivity-content"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Rule Modal -->
  <div id="rule-modal"></div>

  <!-- Scripts -->
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
