# ============================================================================
# odds-edge 全栈编排
# 后端 :3000 + Redis :6379 + 前端 :8080
# 使用：docker compose up -d
# ============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: oe-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oe-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - OE_PORT=3000
      - OE_DB_PATH=/app/data/odds-edge.db
      - OE_REDIS_URL=redis://redis:6379/0
      - OE_API_KEY=${OE_API_KEY:-}
      - OE_API_KEYS=${OE_API_KEYS:-}
      - OE_API_KEY_REVOKED=${OE_API_KEY_REVOKED:-}
      - OE_RATE_LIMIT_MAX=${OE_RATE_LIMIT_MAX:-300}
      - OE_RATE_LIMIT_WINDOW_MS=${OE_RATE_LIMIT_WINDOW_MS:-60000}
      # 多实例共享限流计数：redis（需 OE_REDIS_URL 已接线且本服务已连上）；默认 memory
      - OE_RATE_LIMIT_STORE=${OE_RATE_LIMIT_STORE:-memory}
      # 可选：真实本地人工盘赔目录。在 .env 中设 OE_MANUAL_ODDS_ROOT=<宿主机源目录>
      # （如 D:\ocr_python_data\FootballScreenshotOcr\output），compose 会把它 bind-mount
      # 到容器 /tmp/manual-odds（只读），此处指向该挂载点供后端扫描。
      - OE_MANUAL_ODDS_ROOT=/tmp/manual-odds
      - TZ=Asia/Shanghai
    volumes:
      - oe-data:/app/data
      - ${OE_MANUAL_ODDS_ROOT:-/tmp/nonexistent}:/tmp/manual-odds:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: nginx:alpine
    container_name: oe-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./prototype-1.0.0:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  redis-data:
  oe-data: